name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Signing is off: CI has no Team ID, and the Simulator doesn't need one.
      - name: Build and run tests
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime
                     for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild test \
            -project Goose.xcodeproj \
            -scheme Goose \
            -destination "id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
